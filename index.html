<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic Tac Toe – fujibit</title>
  <meta name="description" content="A clean, mobile-friendly Tic Tac Toe game. Play vs Friend or vs Bot." />
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827ee;
      --muted:#94a3b8;
      --accent:#ff0000;
      --accent-2:#3bd6ee;
      --danger:#ef4444;
      --ring:#7dd3fc55;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
      background:radial-gradient(1200px 800px at 80% -10%,#1e293b 0%,var(--bg) 40%,#0b1224 100%);
      color:#e5e7eb;
      display:grid;
      place-items:center;
      padding:16px;
    }
    .app{width:min(920px,100%)}
    .top{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .title{
      font-weight:700;
      letter-spacing:.3px;
      font-size:clamp(20px,3.6vw,28px);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .title .logo{
      width:28px;
      height:28px;
      border-radius:8px;
      background:linear-gradient(135deg,var(--accent),#a78bfa);
      display:inline-grid;
      place-items:center;
      font-weight:900;
      color:#0a0a0a;
    }
    .card{
      background:linear-gradient(180deg,#0b1224 0%,var(--card) 100%);
      border:1px solid #1f2937;
      border-radius:18px;
      padding:16px;
      box-shadow:0 10px 30px #0006;
    }
    .controls{display:flex;gap:10px;flex-wrap:wrap}
    .select,.btn{
      appearance:none;
      border:none;
      border-radius:12px;
      padding:10px 12px;
      font-weight:600;
      color:#e5e7eb;
      background:#0b1328;
      border:1px solid #1f2937;
      cursor:pointer;
      transition:.2s transform,.2s box-shadow,.2s border-color;
    }
    .select:focus,.btn:focus{
      outline:none;
      box-shadow:0 0 0 6px var(--ring);
    }
    .btn.primary{
      background:linear-gradient(180deg,#0ea5e9,#0284c7);
      border-color:#075985;
    }
    .btn.ghost{background:#0b1328}
    .btn.warn{
      background:linear-gradient(180deg,#ef4444,#b91c1c);
      border-color:#7f1d1d;
    }
    .status{font-size:14px;color:var(--muted);margin-top:8px}

    .board{
      --board-size:10;
      margin-top:16px;
      display:grid;
      grid-template-columns:repeat(var(--board-size),minmax(0,1fr));
      gap:clamp(3px,1vw,10px);
    }
    .cell{
      aspect-ratio:1/1;
      min-width:0;
      border-radius:clamp(5px,1.5vw,16px);
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:clamp(16px,5vw,64px);
      cursor:pointer;
      user-select:none;
      position:relative;
      padding:0;
      color:#e5e7eb;
      background:linear-gradient(180deg,#0b1328,#0a1225);
      border:1px solid #1f2937;
      transition:.15s transform,.2s border-color,.2s background;
    }
    .cell:hover{transform:translateY(-1px);border-color:#334155}
    .cell.disabled{pointer-events:none;opacity:.6}
    .cell.win{background:linear-gradient(180deg,#0b1328,#052e1b);border-color:#14532d}
    .cell.lose{background:linear-gradient(180deg,#0b1328,#2a0b0b);border-color:#7f1d1d}

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .score{display:flex;gap:10px;flex-wrap:wrap}
    .badge{
      padding:8px 12px;
      border-radius:999px;
      background:#0b1328;
      border:1px solid #1f2937;
      font-weight:700;
      font-size:13px;
    }
    .badge .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      margin-right:6px;
    }
    .x .dot{background:var(--accent)}
    .o .dot{background:var(--accent-2)}

    footer{margin-top:14px;text-align:center;color:#9ca3af;font-size:12px}
    a{color:#93c5fd}

    @media (min-width:720px){
      .layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
      .board{grid-column:1}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="title"><span class="logo">XO</span> Tic Tac Toe</div>

      <div class="controls">
        <select id="boardSize" class="select" aria-label="Board size">
          <option value="8">Small — 8×8</option>
          <option value="10" selected>Medium — 10×10</option>
          <option value="12">Large — 12×12</option>
        </select>

        <select id="mode" class="select" aria-label="Game mode">
          <option value="pvp">👥 Vs Friend</option>
          <option value="bot">🤖 Vs Bot</option>
        </select>

        <select id="botLevel" class="select" aria-label="Bot difficulty" title="Bot difficulty">
          <option value="smart">Smart</option>
          <option value="easy">Easy</option>
        </select>

        <button id="newGame" class="btn primary">New Game</button>
        <button id="resetScore" class="btn ghost">Reset Score</button>
        <button id="clear" class="btn warn">Clear Board</button>
      </div>
    </div>

    <div class="layout">
      <div id="board" class="board" role="grid" aria-label="Tic Tac Toe board"></div>

      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:700">Status</div>
            <div id="status" class="status">X starts. Your move.</div>
          </div>

          <div class="score">
            <div class="badge x"><span class="dot"></span>X Wins: <span id="xWins">0</span></div>
            <div class="badge o"><span class="dot"></span>O Wins: <span id="oWins">0</span></div>
            <div class="badge">Draws: <span id="draws">0</span></div>
          </div>
        </div>

        <footer>
          Built with ♥ by fujibit. Tip: Press <strong>R</strong> to restart, <strong>C</strong> to clear.
        </footer>
      </div>
    </div>
  </div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const xWinsEl = document.getElementById('xWins');
  const oWinsEl = document.getElementById('oWins');
  const drawsEl = document.getElementById('draws');
  const newBtn = document.getElementById('newGame');
  const resetBtn = document.getElementById('resetScore');
  const clearBtn = document.getElementById('clear');
  const modeSel = document.getElementById('mode');
  const levelSel = document.getElementById('botLevel');
  const boardSizeSel = document.getElementById('boardSize');

  let boardSize = Number(boardSizeSel.value);
  let winLength = 4;
  let cells = [];
  let turn = 'X';
  let over = false;
  let score = { X:0, O:0, D:0 };
  let gameId = 0;

  function saveScore(){
    localStorage.setItem('ttt-score', JSON.stringify(score));
  }

  function loadScore(){
    try{
      const saved = JSON.parse(localStorage.getItem('ttt-score'));
      if(saved && Number.isFinite(saved.X) && Number.isFinite(saved.O) && Number.isFinite(saved.D)){
        score = saved;
      }
    }catch(e){}

    xWinsEl.textContent = score.X;
    oWinsEl.textContent = score.O;
    drawsEl.textContent = score.D;
  }

  function getWinningLines(){
    const lines = [];
    const directions = [
      [0, 1],
      [1, 0],
      [1, 1],
      [1, -1]
    ];

    for(let row = 0; row < boardSize; row++){
      for(let col = 0; col < boardSize; col++){
        for(const [rowStep, colStep] of directions){
          const endRow = row + (winLength - 1) * rowStep;
          const endCol = col + (winLength - 1) * colStep;

          if(endRow < 0 || endRow >= boardSize || endCol < 0 || endCol >= boardSize){
            continue;
          }

          const line = [];
          for(let step = 0; step < winLength; step++){
            line.push(
              (row + step * rowStep) * boardSize +
              (col + step * colStep)
            );
          }
          lines.push(line);
        }
      }
    }

    return lines;
  }

  function draw(){
    boardEl.innerHTML = '';
    boardEl.style.setProperty('--board-size', boardSize);
    boardEl.setAttribute(
      'aria-label',
      `${boardSize} by ${boardSize} Tic Tac Toe board. ${turn}'s turn.`
    );

    cells.forEach((value, index) => {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.setAttribute('role', 'gridcell');
      btn.setAttribute('aria-label', value ? `Cell ${index + 1}: ${value}` : `Cell ${index + 1}`);
      btn.dataset.idx = index;
      btn.textContent = value || '';

      if(over || value) btn.classList.add('disabled');

      btn.addEventListener('click', onCell);
      boardEl.appendChild(btn);
    });
  }

  function checkWin(board){
    for(const line of getWinningLines()){
      const player = board[line[0]];

      if(player && line.every(index => board[index] === player)){
        return { player, line };
      }
    }

    if(board.every(Boolean)){
      return { player:null, line:null, draw:true };
    }

    return null;
  }

  function setStatus(message){
    statusEl.textContent = message;
  }

  function end(result){
    over = true;

    const boardCells = [...boardEl.children];

    if(result.draw){
      score.D++;
      drawsEl.textContent = score.D;
      setStatus('Draw!');
      saveScore();
      return;
    }

    score[result.player]++;
    if(result.player === 'X') xWinsEl.textContent = score.X;
    else oWinsEl.textContent = score.O;

    setStatus(`${result.player} wins!`);
    saveScore();

    for(const index of result.line){
      boardCells[index].classList.add('win');
    }

    for(let index = 0; index < cells.length; index++){
      if(!result.line.includes(index) && cells[index]){
        boardCells[index].classList.add('lose');
      }
    }
  }

  function onCell(event){
    const index = Number(event.currentTarget.dataset.idx);

    if(over || cells[index]) return;

    move(index, turn);

    const result = checkWin(cells);
    if(result){
      draw();
      end(result);
      return;
    }

    turn = turn === 'X' ? 'O' : 'X';
    setStatus(`${turn}'s turn`);
    draw();

    if(modeSel.value === 'bot' && turn === 'O'){
      const currentGame = gameId;
      setTimeout(() => {
        if(currentGame === gameId && !over && turn === 'O') botMove();
      }, 220);
    }
  }

  function move(index, player){
    cells[index] = player;
  }

  function available(board){
    return board
      .map((value, index) => value ? null : index)
      .filter(index => index !== null);
  }

  function botMove(){
    const options = available(cells);
    if(!options.length) return;

    const index = levelSel.value === 'easy' ? randomMove() : smartMove();
    move(index == null ? options[0] : index, 'O');

    const result = checkWin(cells);
    draw();

    if(result){
      end(result);
      return;
    }

    turn = 'X';
    setStatus("X's turn");
  }

  function randomMove(){
    const options = available(cells);
    if(!options.length) return null;
    return options[Math.floor(Math.random() * options.length)];
  }

  function smartMove(){
    const options = available(cells);

    // Win if possible.
    for(const index of options){
      const clone = cells.slice();
      clone[index] = 'O';
      if(checkWin(clone)?.player === 'O') return index;
    }

    // Block the opponent if necessary.
    for(const index of options){
      const clone = cells.slice();
      clone[index] = 'X';
      if(checkWin(clone)?.player === 'X') return index;
    }

    // Prefer the center area.
    const center = Math.floor(boardSize / 2);
    const centerCandidates = [
      center * boardSize + center,
      center * boardSize + center - 1,
      (center - 1) * boardSize + center,
      (center - 1) * boardSize + center - 1
    ].filter(index => index >= 0 && cells[index] == null);

    if(centerCandidates.length){
      return centerCandidates[Math.floor(Math.random() * centerCandidates.length)];
    }

    return randomMove();
  }

  function newGame(){
    gameId++;
    cells = Array(boardSize * boardSize).fill(null);
    over = false;
    turn = 'X';
    draw();
    setStatus(`X starts. Get ${winLength} in a row to win.`);
  }

  function clearBoard(){
    gameId++;
    cells = Array(boardSize * boardSize).fill(null);
    over = false;
    draw();
    setStatus(`${turn}'s turn`);
  }

  function resetScore(){
    score = { X:0, O:0, D:0 };
    saveScore();
    loadScore();
    setStatus('Score reset. New match!');
  }

  newBtn.addEventListener('click', newGame);
  resetBtn.addEventListener('click', resetScore);
  clearBtn.addEventListener('click', clearBoard);
  modeSel.addEventListener('change', newGame);
  boardSizeSel.addEventListener('change', () => {
    boardSize = Number(boardSizeSel.value);
    newGame();
  });

  window.addEventListener('keydown', event => {
    if(event.key === 'r' || event.key === 'R') newGame();
    if(event.key === 'c' || event.key === 'C') clearBoard();
  });

  loadScore();
  newGame();
})();
</script>
</body>
</html>
